[package]
name = "ai-town"
version = "0.1.0"
description = "AI 小镇文本解谜游戏"
authors = ["AI Town"]
edition = "2021"

[lib]
name = "ai_town_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
